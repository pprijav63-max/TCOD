name: TCOD TED XML and UNESCO Data Diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/source-debug.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe source HTTP status and response structure
        run: |
          python3 - <<'PY'
          import urllib.request,json,time
          reqs=[
           ("ted-a","https://ted.europa.eu/en/notice/701863-2026/xml","application/xml,text/xml"),
           ("ted-b","https://ted.europa.eu/en/notice/701863-2026/xml","application/json, application/xml, text/xml;q=0.9, */*;q=0.2"),
           ("ted-c","https://ted.europa.eu/en/notice/701863-2026/xml?download=true","application/xml"),
           ("unesco-1","https://data.unesco.org/api/explore/v2.1/catalog/datasets/whc001/records?limit=1","application/json"),
           ("unesco-100","https://data.unesco.org/api/explore/v2.1/catalog/datasets/whc001/records?limit=100&offset=0","application/json"),
           ("unesco-50","https://data.unesco.org/api/explore/v2.1/catalog/datasets/whc001/records?limit=50&offset=0","application/json")
          ]
          for name,url,accept in reqs:
           try:
            headers={'Accept':accept,'User-Agent':'TCOD-Heritage-Radar/2.0 (public cultural-heritage procurement analysis)'}
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=25) as r:
             data=r.read(1000000)
             print("RESULT",name,"STATUS",r.status,"TYPE",r.headers.get('Content-Type'),"BYTES",len(data),"PREFIX",repr(data[:130]),flush=True)
             if name.startswith('unesco') and data:
              x=json.loads(data);print("UNESCO",name,"total",x.get('total_count'),"results",len(x.get('results',[])),flush=True)
           except Exception as e:print("ERROR",name,type(e).__name__,str(e)[:200],flush=True)
           time.sleep(.4)
          PY
