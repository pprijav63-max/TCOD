name: TCOD Worldwide Cultural Heritage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/heritage_sync.py'
      - '.github/workflows/heritage-daily.yml'
  schedule:
    - cron: '35 6 * * *'
    - cron: '35 7 * * *'
permissions:
  contents: write
concurrency:
  group: tcod-heritage-daily
  cancel-in-progress: false
jobs:
  heritage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Check Swiss local 08:35
        id: local
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          d=datetime.now(ZoneInfo("Europe/Zurich"))
          event=os.environ.get("EVENT_NAME","")
          good=event in ("push","workflow_dispatch") or d.hour==8
          print("run="+str(good).lower())
          PY
      - name: Compile heritage importer
        if: steps.local.outputs.run == 'true'
        run: python3 -m py_compile scripts/heritage_sync.py
      - name: Search current public heritage opportunities
        if: steps.local.outputs.run == 'true'
        env:
          TCOD_UA_PAGES: '2'
        run: python3 scripts/heritage_sync.py
      - name: Check JSON feed and publish
        if: steps.local.outputs.run == 'true'
        run: |
          python3 -m json.tool docs/data/heritage.json >/dev/null
          git config user.name "tcod-heritage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/heritage.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily global heritage projects and official sources"
            for attempt in 1 2 3 4 5; do
              git pull --rebase
              if git push; then break; fi
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep 3
            done
          fi
